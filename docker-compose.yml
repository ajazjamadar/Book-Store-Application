# BookStore Application — Docker Compose
# Structure:
#   db       → MySQL 8.0 (persistent volume + init.sql)
#   backend  → Spring Boot (Java 21) — waits for db to be healthy
#   frontend → Nginx (static files + API proxy) — waits for backend to be healthy
#
# Usage:
#   cp .env.example .env   # fill in secrets
#   docker compose up --build

services:

  # MySQL Database
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Root@1234}
      MYSQL_DATABASE: bookstore_db
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - bookstore-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=${MYSQL_ROOT_PASSWORD:-Root@1234}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Spring Boot Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/bookstore_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Root@1234}
      SPRING_PROFILES_ACTIVE: prod
      APP_FRONTEND_URL: http://localhost
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@bookstore.com}
      EMAIL_TO: ${EMAIL_TO:-rrm36.orders@inbox.testmail.app}
      TESTMAIL_API_KEY: ${TESTMAIL_API_KEY}
      TESTMAIL_NAMESPACE: ${TESTMAIL_NAMESPACE:-rrm36}
      JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bookstore-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/books > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # Nginx Frontend
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - bookstore-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

# Networks
networks:
  bookstore-net:
    driver: bridge

# Volumes
volumes:
  mysql_data:
    driver: local

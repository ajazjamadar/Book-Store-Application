<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Store Application</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Book Store Application</h1>
        
        <!-- Add Book Form -->
        <div class="section">
            <h2>Add New Book</h2>
            <form id="addBookForm">
                <input type="text" id="bookName" placeholder="Book Name" required>
                <input type="text" id="bookAuthor" placeholder="Author" required>
                <input type="number" id="bookPrice" placeholder="Price" step="0.01" min="0.01" required>
                <button type="submit">Add Book</button>
            </form>
        </div>

        <!-- Books List -->
        <div class="section">
            <h2>All Books</h2>
            <div id="booksList"></div>
        </div>

        <!-- Payment Section -->
        <div class="section">
            <h2>Purchase Book - Payment Required</h2>
            
            <div class="form-row">
                <input type="text" id="paymentBookName" placeholder="Book Name" required style="width: 48%;">
                <input type="number" id="paymentAmount" placeholder="Amount" step="0.01" min="0.01" required style="width: 48%;">
            </div>
            
            <div class="form-group">
                <label for="paymentType">Payment Method:</label>
                <select id="paymentType" style="width: 100%;">
                    <option value="upi">UPI (PhonePe, Google Pay, Paytm)</option>
                    <option value="credit">Credit Card</option>
                    <option value="debit">Debit Card</option>
                </select>
            </div>
            
            <!-- UPI Fields -->
            <div id="upiFields" class="payment-fields" style="display: block;">
                <h3 style="margin-bottom: 10px; color: #333;">UPI Payment Details</h3>
                <input type="text" id="upiId" placeholder="UPI ID (e.g., yourname@paytm)" style="width: 100%;">
            </div>
            
            <!-- Card Fields -->
            <div id="cardFields" class="payment-fields" style="display: none;">
                <h3 style="margin-bottom: 10px; color: #333;">Card Payment Details</h3>
                <input type="text" id="cardNumber" placeholder="Card Number (16 digits)" maxlength="19" style="width: 100%;">
                <input type="text" id="cardHolder" placeholder="Card Holder Name" style="width: 100%;">
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="expiryDate" placeholder="Expiry (MM/YY)" maxlength="5" style="width: 48%;">
                    <input type="text" id="cvv" placeholder="CVV" maxlength="4" style="width: 48%;">
                </div>
            </div>
            
            <button onclick="processPayment()" class="btn-primary">Complete Payment & Place Order</button>
        </div>

        <div id="message"></div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
